<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird - Red Bird Edition</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    overflow: hidden; font-family: Arial, sans-serif;
    background: #79d9ff;
  }
  body { display: grid; place-items: center; }
  #game {
    position: relative;
    width: min(100vw, 480px);
    height: min(100vh, 760px);
    overflow: hidden;
    background: linear-gradient(#67d5ff 0%, #b9efff 72%, #8bdc55 72%, #68bd3c 100%);
    user-select: none;
    touch-action: manipulation;
  }
  #game::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 18% 18%, rgba(255,255,255,.9) 0 28px, transparent 29px),
      radial-gradient(circle at 75% 28%, rgba(255,255,255,.8) 0 22px, transparent 23px);
    opacity: .75;
  }
  #score {
    position: absolute; top: 22px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    color: white; font-size: 54px; font-weight: 900;
    text-shadow: 3px 3px 0 #555, -2px -2px 0 #555;
  }
  #bird {
    position: absolute; width: 44px; height: 38px;
    z-index: 6; left: 105px; top: 300px;
    border: 3px solid #8b1717; border-radius: 50% 48% 45% 50%;
    background: #e7352d;
    box-shadow: inset -7px -4px 0 rgba(120,0,0,.15);
  }
  #bird:before {
    content:""; position:absolute; width:17px; height:12px;
    background:#fff; border:2px solid #222; border-radius:50%;
    right:5px; top:5px;
  }
  #bird:after {
    content:""; position:absolute; width:15px; height:7px;
    background:#ffbf22; border:2px solid #8a4d00;
    right:-12px; top:17px; transform:rotate(-2deg);
    border-radius:2px 8px 8px 2px;
  }
  .brow {
    position:absolute; width:15px; height:5px; background:#351313;
    top:4px; right:4px; transform:rotate(12deg); border-radius:5px;
  }
  .brow.two { right:14px; transform:rotate(-18deg); }
  .pupil {
    position:absolute; width:6px; height:6px; border-radius:50%;
    background:#111; right:10px; top:9px; z-index:2;
  }
  .wing {
    position:absolute; width:19px; height:13px; background:#c91f24;
    left:-4px; top:20px; border-radius:50%;
    transform:rotate(-18deg);
  }
  .pipe {
    position:absolute; width:66px; z-index:4;
    background:linear-gradient(90deg,#d7a900,#ffe21f 45%,#c69a00);
    border:3px solid #927400;
    box-shadow: inset -8px 0 rgba(80,60,0,.15);
  }
  .pipe.top { top:0; }
  .pipe.bottom { bottom:0; }
  .pipeCap {
    position:absolute; height:25px; width:78px;
    margin-left:-9px;
    background:linear-gradient(90deg,#d7a900,#ffe21f 45%,#c69a00);
    border:3px solid #927400;
    box-shadow: inset -8px 0 rgba(80,60,0,.15);
  }
  .pipe.top .pipeCap { bottom:-3px; }
  .pipe.bottom .pipeCap { top:-3px; }
  #ground {
    position:absolute; bottom:0; left:0; width:100%; height:34px;
    background:repeating-linear-gradient(135deg,#6bc442 0 12px,#82d851 12px 24px);
    border-top:4px solid #4e982f; z-index:8;
  }
  #message {
    position:absolute; inset:0; z-index:20; display:grid; place-items:center;
    background:rgba(0,0,0,.28);
  }
  .panel {
    width:82%; max-width:340px; padding:26px 20px;
    text-align:center; background:#fff; border:5px solid #555;
    border-radius:20px; box-shadow:0 10px 0 rgba(0,0,0,.25);
  }
  .panel h1 { margin:0 0 8px; font-size:38px; color:#e7352d; }
  .panel p { margin:8px 0 18px; font-size:18px; color:#333; }
  button {
    border:0; border-radius:12px; padding:13px 28px;
    font-size:20px; font-weight:800; color:white;
    background:#e7352d; cursor:pointer;
    box-shadow:0 5px 0 #9d1d19;
  }
  button:active { transform:translateY(4px); box-shadow:0 1px 0 #9d1d19; }
  .hidden { display:none !important; }
  #hint {
    position:absolute; bottom:43px; left:50%; transform:translateX(-50%);
    z-index:10; color:white; font-weight:700; text-shadow:1px 1px 2px #333;
    white-space:nowrap;
  }
</style>
</head>
<body>
<div id="game">
  <div id="score">0</div>
  <div id="bird"><span class="brow"></span><span class="brow two"></span><span class="pupil"></span><span class="wing"></span></div>
  <div id="hint">Tap / Click / Space to flap</div>
  <div id="ground"></div>

  <div id="message">
    <div class="panel">
      <h1 id="title">Flappy Bird</h1>
      <p id="sub">Red bird • Yellow pipes<br>Tap or press Space to fly!</p>
      <button id="startBtn">START GAME</button>
    </div>
  </div>
</div>

<script>
(() => {
  const game = document.getElementById("game");
  const bird = document.getElementById("bird");
  const scoreEl = document.getElementById("score");
  const message = document.getElementById("message");
  const title = document.getElementById("title");
  const sub = document.getElementById("sub");
  const startBtn = document.getElementById("startBtn");
  const hint = document.getElementById("hint");

  let birdY = 300, velocity = 0, score = 0;
  let running = false, lastTime = 0, spawnTimer = 0, pipes = [];
  const gravity = 1450;
  const flapPower = -430;
  const pipeSpeed = 190;
  const pipeWidth = 66;
  const gap = 165;
  let audioCtx = null;

  function sound(type) {
    try {
      audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      if (type === "flap") {
        o.frequency.setValueAtTime(520, now);
        o.frequency.exponentialRampToValueAtTime(760, now + .08);
        g.gain.setValueAtTime(.08, now);
        g.gain.exponentialRampToValueAtTime(.001, now + .09);
        o.start(now); o.stop(now + .1);
      } else if (type === "score") {
        o.frequency.setValueAtTime(700, now);
        o.frequency.setValueAtTime(1000, now + .07);
        g.gain.setValueAtTime(.07, now);
        g.gain.exponentialRampToValueAtTime(.001, now + .18);
        o.start(now); o.stop(now + .19);
      } else {
        o.frequency.setValueAtTime(180, now);
        o.frequency.exponentialRampToValueAtTime(70, now + .25);
        g.gain.setValueAtTime(.1, now);
        g.gain.exponentialRampToValueAtTime(.001, now + .25);
        o.start(now); o.stop(now + .26);
      }
    } catch(e) {}
  }

  function reset() {
    pipes.forEach(p => p.top.remove());
    pipes.forEach(p => p.bottom.remove());
    pipes = [];
    score = 0; scoreEl.textContent = score;
    birdY = game.clientHeight * .42; velocity = 0;
    bird.style.top = birdY + "px";
    bird.style.transform = "rotate(0deg)";
    spawnTimer = 0;
  }

  function flap() {
    if (!running) return;
    velocity = flapPower;
    sound("flap");
  }

  function start() {
    reset();
    running = true;
    message.classList.add("hidden");
    hint.classList.remove("hidden");
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    running = false;
    sound("hit");
    title.textContent = "Game Over!";
    sub.innerHTML = `Score: <b>${score}</b><br>Try again!`;
    startBtn.textContent = "RESTART";
    message.classList.remove("hidden");
  }

  function spawnPipe() {
    const h = game.clientHeight;
    const minTop = 65, maxTop = h - 34 - gap - 65;
    const topH = minTop + Math.random() * Math.max(1, maxTop - minTop);

    const top = document.createElement("div");
    top.className = "pipe top";
    top.style.height = topH + "px";
    top.style.left = game.clientWidth + "px";
    const cap1 = document.createElement("div");
    cap1.className = "pipeCap";
    top.appendChild(cap1);

    const bottom = document.createElement("div");
    bottom.className = "pipe bottom";
    bottom.style.height = (h - 34 - (topH + gap)) + "px";
    bottom.style.left = game.clientWidth + "px";
    const cap2 = document.createElement("div");
    cap2.className = "pipeCap";
    bottom.appendChild(cap2);

    game.appendChild(top); game.appendChild(bottom);
    pipes.push({top, bottom, x: game.clientWidth, scored:false});
  }

  function collision(p) {
    const bx = 105, by = birdY, bw = 44, bh = 38;
    const px = p.x, pw = pipeWidth;
    const gapTop = parseFloat(p.top.style.height);
    const gapBottom = gapTop + gap;
    const hitX = bx + bw - 5 > px && bx + 5 < px + pw;
    const hitPipe = by + bh - 5 > gapBottom || by + 5 < gapTop;
    return hitX && hitPipe;
  }

  function loop(t) {
    if (!running) return;
    const dt = Math.min((t - lastTime) / 1000, .033);
    lastTime = t;

    velocity += gravity * dt;
    birdY += velocity * dt;
    bird.style.top = birdY + "px";
    bird.style.transform = `rotate(${Math.max(-25, Math.min(80, velocity / 9))}deg)`;

    spawnTimer += dt;
    if (spawnTimer > 1.55) { spawnTimer = 0; spawnPipe(); }

    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.x -= pipeSpeed * dt;
      p.top.style.left = p.x + "px";
      p.bottom.style.left = p.x + "px";

      if (!p.scored && p.x + pipeWidth < 105) {
        p.scored = true; score++;
        scoreEl.textContent = score; sound("score");
      }
      if (collision(p)) return gameOver();

      if (p.x < -90) {
        p.top.remove(); p.bottom.remove(); pipes.splice(i,1);
      }
    }

    if (birdY + 38 >= game.clientHeight - 34 || birdY <= 0) return gameOver();
    requestAnimationFrame(loop);
  }

  function action(e) {
    if (e.type === "keydown" && !["Space","ArrowUp"].includes(e.code)) return;
    e.preventDefault();
    if (!running) start(); else flap();
  }

  startBtn.addEventListener("click", start);
  game.addEventListener("pointerdown", e => {
    if (e.target === startBtn) return;
    action(e);
  });
  window.addEventListener("keydown", action);

  hint.classList.remove("hidden");
})();
</script>
</body>
</html>
